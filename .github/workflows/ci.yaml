---
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Coverage gate: the job fails if total statement coverage drops below this.
  # Measured with -coverpkg=./... so end-to-end tests count toward source
  # packages. Current real coverage is ~81%. Raise this only as coverage climbs.
  COVERAGE_THRESHOLD: "80.0"

  # Test-only configuration. The integration suite (backend/tests) spins up
  # Postgres/Redis via testcontainers and reads these to create the containers
  # and load config; values are throwaway and contain no real secrets.
  DB_NAME: app_db
  DB_USER: app
  DB_PASSWORD: app
  JWT_SECRET: ci-test-only-secret-0123456789abcdef
  GIN_MODE: release

jobs:
  backend:
    name: Backend tests & coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download modules
        run: go mod download

      # docs/ (docs.go, swagger.{json,yaml}) is gitignored and generated by
      # `make swagger`. cmd/server imports it, so it must exist before build.
      - name: Generate OpenAPI spec
        run: go tool swag init -g cmd/server/main.go -o docs --parseDependency --parseInternal --quiet

      - name: Run tests with coverage
        # -race catches data races (rate limiter uses sync.Map + atomics).
        # -coverpkg=./... attributes integration-test coverage to source
        # packages, not just the test package itself.
        run: |
          go test ./... \
            -race \
            -count=1 \
            -covermode=atomic \
            -coverpkg=./... \
            -coverprofile=coverage.out \
            -timeout=10m

      - name: Compute total coverage
        id: cov
        run: |
          go tool cover -func=coverage.out | tee coverage.txt
          total=$(awk '/^total:/ {gsub("%","",$3); print $3}' coverage.txt)
          echo "total=${total}" >> "$GITHUB_OUTPUT"

      - name: Write PR summary
        if: always() && steps.cov.outputs.total != ''
        run: |
          total="${{ steps.cov.outputs.total }}"
          threshold="${{ env.COVERAGE_THRESHOLD }}"
          if awk -v t="$total" -v th="$threshold" 'BEGIN { exit !(t+0 >= th+0) }'; then
            badge="\`\`\`✅ ${total}% (>= ${threshold}%)\`\`\`"
          else
            badge="\`\`\`❌ ${total}% (< ${threshold}%)\`\`\`"
          fi
          {
            echo "## Backend coverage"
            echo ""
            echo "${badge}"
            echo ""
            echo "<details><summary>Per-function coverage</summary>"
            echo ""
            echo '```'
            cat coverage.txt
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: backend-coverage
          path: |
            backend/coverage.out
            backend/coverage.txt

      - name: Enforce coverage threshold
        run: |
          total="${{ steps.cov.outputs.total }}"
          threshold="${{ env.COVERAGE_THRESHOLD }}"
          if [ -z "$total" ]; then
            echo "::error::no coverage value produced"
            exit 1
          fi
          if awk -v t="$total" -v th="$threshold" 'BEGIN { exit !(t+0 >= th+0) }'; then
            echo "::notice::backend coverage ${total}% meets ${threshold}% threshold"
          else
            echo "::error::backend coverage ${total}% is below ${threshold}% threshold"
            exit 1
          fi

  frontend-format:
    name: Frontend format (prettier)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Fails the job if any src/**/*.{js,jsx} file is not prettier-formatted.
      # Run `make fmt` (or `npm run format`) locally to fix.
      - name: Check formatting
        run: npm run format:check

  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          # golangci-lint-action manages its own build/lint cache.
          cache: false

      # docs/ (docs.go, swagger.{json,yaml}) is gitignored and generated by
      # `make swagger`. cmd/server imports it, so it must exist before the
      # linter's typecheck pass can resolve the import.
      - name: Generate OpenAPI spec
        working-directory: backend
        run: go tool swag init -g cmd/server/main.go -o docs --parseDependency --parseInternal --quiet

      # Runs gofmt/gofumpt/goimports/gci formatters, go vet (govet) and the full
      # linter set from backend/.golangci.yml. Config: backend/.golangci.yml.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: backend
