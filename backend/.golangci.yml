# golangci-lint v2 configuration for the Transcendence Go backend.
# Adapted from the kubebuilder/kubectl-style preset: Ginkgo- and
# kubebuilder-specific pieces (ginkgolinter, the sigs.k8s.io importas aliases,
# ginkgo dot-imports, the kubebuilder gci prefix) were dropped, and the
# revive "models"/"helpers" bad-package-name ban was removed because this repo
# legitimately uses a `models` package.
version: "2"

run:
  allow-parallel-runners: true

linters:
  default: none
  enable:
    - asciicheck
    - bidichk
    - copyloopvar
    - depguard
    - dupl
    - errcheck
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - modernize
    - misspell
    - nakedret
    - nolintlint
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - wrapcheck
    - whitespace
  settings:
    depguard:
      rules:
        forbid-pkg-errors:
          deny:
            - pkg: sort
              desc: Should be replaced with the slices package
    goconst:
      # gin response envelope keys ("error"/"message"/"data"/...) are framework
      # idiom, not magic constants worth extracting.
      ignore-string-values:
        - '^(error|message|data|token|total|unauthorized|Unauthorized)$'
    wrapcheck:
      # Only require wrapping for genuinely third-party errors. Errors crossing
      # our own internal package boundaries (service -> repository, etc.) are
      # passed through deliberately and re-wrapped where it adds context.
      ignore-package-globs:
        - github.com/Transcendence/**
    govet:
      disable:
        - fieldalignment
      enable-all: true
    modernize:
      disable:
        # Suggests replacing omitempty with omitzero on struct fields; too noisy
        # for the existing codebase.
        - omitzero
        # Suggests new(x) for ptr.To(x), which is semantically incorrect.
        - newexpr
    nolintlint:
      allow-unused: false
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          disabled: true
        - name: if-return
        - name: import-shadowing
        - name: increment-decrement
        - name: var-naming
          severity: warning
          arguments:
            - ["ID", "URL", "JWT", "API", "DB", "UUID", "HTTP", "WS", "JSON"] # allowed initialisms
            - [] # disallowed initialisms
            - [
                {
                  skip-initialism-name-checks: true,
                  upper-case-const: true,
                  skip-package-name-checks: true,
                },
              ]
        - name: var-declaration
        - name: package-comments
          disabled: true
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
        - name: bool-literal-in-expr
        - name: constant-logical-expr
        - name: comment-spacings
  exclusions:
    generated: lax
    rules:
      # Test files are intentionally repetitive and use long table literals;
      # don't hold them to the same duplication/length/wrapping bars.
      - linters:
          - dupl
          - lll
          - wrapcheck
          - errcheck
          - gocyclo
          - goconst
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/Transcendence)
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
