<!DOCTYPE html>
<html>
<head>
  <title>Search API Test</title>
  <style>
    body { font-family: monospace; padding: 20px; max-width: 800px; margin: 0 auto; }
    #log { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 10px; margin: 10px 0; background: #f5f5f5; }
    .received { color: green; }
    .sent { color: blue; }
    .error { color: red; }
    .system { color: gray; }
    input, button, select { padding: 8px; margin: 4px; }
    input[type="text"] { width: 200px; }
    hr { margin: 16px 0; }
    label { display: inline-block; width: 70px; }
  </style>
</head>
<body>
  <h2>Search API Test</h2>
  <div>Login first, then run a search.</div>
  
  <!-- REGISTER -->
  <h3>Register</h3>
  <div>
    <input id="reg_username" type="text" placeholder="username" value="testuser" />
    <input id="reg_email" type="text" placeholder="email" value="test@test.com" />
    <input id="reg_password" type="password" placeholder="password" value="Secret1s!2ds3" />
    <input id="reg_dob" type="date" value="1995-06-15" />
    <button onclick="register()">Register</button>
  </div>

  <hr/>
  <!-- LOGIN -->
  <h3>Login</h3>
  <div>
    <input id="login_identifier" type="text" placeholder="username or email" value="testuser" />
    <input id="login_password" type="password" placeholder="password" value="Secret1s!2ds3" />
    <button onclick="login()">Login</button>
  </div>

  <hr/>

  <!-- SEARCH -->
  <h3>Search</h3>
  <div>
    <label>Query</label>
    <input id="q" type="text" placeholder="search term" value="ali" />
  </div>
  <div>
    <label>Type</label>
    <select id="type">
      <option value="user">user</option>
      <option value="message">message</option>
      <!-- <option value="group">group</option> -->
    </select>
  </div>
  <div>
    <label>Sort</label>
    <input id="sort" type="text" placeholder="sort field" value="username" />
    <label>Order</label>
    <select id="order">
      <option value="asc">asc</option>
      <option value="desc">desc</option>
    </select>
  </div>
  <div>
    <label>Page</label>
    <input id="page" type="text" value="1" style="width:60px" />
    <label>Limit</label>
    <input id="limit" type="text" value="20" style="width:60px" />
  </div>
  <div>
    <button onclick="search()">Search</button>
    <button onclick="nextPage()">Next Page</button>
    <button onclick="clearLog()">Clear Log</button>
  </div>

  <div id="log"></div>

  <script>
    const BASE = 'http://localhost:8000'
    let token = null

    function log(msg, type = 'system') {
      const div = document.getElementById('log')
      const line = document.createElement('div')
      line.className = type
      line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`
      div.appendChild(line)
      div.scrollTop = div.scrollHeight
    }

    function clearLog() {
      document.getElementById('log').innerHTML = ''
    }

    async function register() {
      const username = document.getElementById('reg_username').value
      const email = document.getElementById('reg_email').value
      const password = document.getElementById('reg_password').value
      const dateOfBirth = document.getElementById('reg_dob').value

      try {
        const res = await fetch('http://localhost:8000/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password, dateOfBirth })
        })
        const data = await res.json()
        if (res.ok) {
          log(`Registered: ${data.username}`, 'system')
        } else {
          log(`Register failed: ${data.error}`, 'error')
        }
      } catch (e) {
        log(`Register error: ${e.message}`, 'error')
      }
    }

    async function login() {
      const identifier = document.getElementById('login_identifier').value
      const password = document.getElementById('login_password').value
      const isEmail = identifier.includes('@')
      const body = isEmail ? { email: identifier, password } : { username: identifier, password }

      try {
        const res = await fetch(`${BASE}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        })
        const data = await res.json()
        if (data.token) {
          token = data.token
          log(`Logged in as ${data.user?.username} — token saved`, 'system')
        } else {
          log(`Login failed: ${JSON.stringify(data)}`, 'error')
        }
      } catch (e) {
        log(`Login error: ${e.message}`, 'error')
      }
    }

    async function search() {
      if (!token) { log('Login first!', 'error'); return }

      const params = new URLSearchParams({
        q:     document.getElementById('q').value,
        type:  document.getElementById('type').value,
        sort:  document.getElementById('sort').value,
        order: document.getElementById('order').value,
        page:  document.getElementById('page').value,
        limit: document.getElementById('limit').value
      })

      const url = `${BASE}/api/search?${params.toString()}`
      log(`SENT: GET ${url}`, 'sent')

      try {
        const res = await fetch(url, {
          headers: { 'Authorization': `Bearer ${token}` }
        })
        const data = await res.json()
        if (res.ok) {
          const count = (data.users?.length ?? 0) + (data.messages?.length ?? 0) + (data.groups?.length ?? 0)
          log(`RECEIVED (${count} results, total=${data.total}, page=${data.page}): ${JSON.stringify(data)}`, 'received')
        } else {
          log(`Search failed (${res.status}): ${JSON.stringify(data)}`, 'error')
        }
      } catch (e) {
        log(`Search error: ${e.message}`, 'error')
      }
    }

    function nextPage() {
      const pageInput = document.getElementById('page')
      pageInput.value = (parseInt(pageInput.value || '1', 10) + 1).toString()
      search()
    }

    // Enter key in the query field triggers a search
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && document.activeElement.id === 'q') {
        search()
      }
    })
  </script>
</body>
</html>
