services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: backend
    # Internal only — reached through the proxy at /api.
    volumes:
      - ../backend:/app
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: frontend
    # Internal only — the proxy is the public entrypoint.
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy

  proxy:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nginx
    container_name: proxy
    # Fixed public port. 3000 (not 80/443) because rootless Podman can't bind
    # privileged ports (<1024); the proxy serves HTTPS on container :443.
    ports:
      - "3000:443"
    # The TLS cert is baked into the proxy image at build time (see
    # docker/Dockerfile.nginx) rather than bind-mounted from the host — a host
    # mount trips SELinux/rootless-Podman permission denials on the cert files.
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

  db:
    image: docker.io/library/postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  seedfull:
    image: golang:1.25-alpine
    container_name: seedfull
    working_dir: /app
    volumes:
      - ../backend:/app
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - seedfull
    command: ["go", "run", "./cmd/seedfull"]

volumes:
  db_data:
  redis_data:
